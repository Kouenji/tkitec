<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tki Tec - Hardware Details</title>
  
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
        --primary-font: 'IBM Plex Sans', sans-serif;
        --accent-font: 'IBM Plex Mono', monospace;
        --surface: #0d1215;
        --card-bg: #151e22;
        --border-color: rgba(255, 255, 255, 0.1);
        --btn-red: var(--accent-red);
    }

    body {
        font-family: var(--primary-font);
        background: var(--surface);
        background: var(--bg-dark);
        color: white;
        line-height: 1.6;
        padding-block-start: 110px; /* Perfect spacing for the fixed header */
    }

    /* 1. LAYOUT STRUCTURE */
    .detail-wrapper {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 50px;
        margin-top: 20px;
        padding-bottom: 120px;
    }

    /* 2. PREMIUM SIDEBAR */
    .sidebar-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 30px;
        height: fit-content;
        position: sticky;
        top: 110px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        z-index: 10;
        /* Scroll Logic Permission */
        scroll-behavior: smooth;
    }

    .sidebar-card h2 {
        font-size: 2.2rem;
        font-weight: 800;
        margin-bottom: 25px;
        border-bottom: 3px solid var(--electric-blue);
        padding-bottom: 10px;
    }

    .nav-group { margin-bottom: 15px; }

    .nav-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 15px;
        background: rgba(255,255,255,0.03);
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
        border: 1px solid transparent;
        font-size: 1.6rem;
    }

    .nav-header:hover { border-color: var(--electric-blue); background: rgba(214, 91, 97, 0.06); }
    .nav-header ion-icon { transition: 0.3s; font-size: 1.8rem; color: var(--electric-blue); }
    .nav-header.active ion-icon { transform: rotate(180deg); }

    .nav-submenu {
        display: none;
        flex-direction: column;
        padding: 10px 5px 5px 20px;
    }

    .nav-submenu.active { display: flex; }

    .sub-link {
        padding: 10px 0;
        color: #8b949e;
        font-size: 1.5rem;
        text-decoration: none;
        transition: 0.2s;
        display: flex;
        align-items: center;
        gap: 10px;
        border-left: 2px solid var(--border-color);
        padding-left: 15px;
        margin-bottom: 5px;
    }

    .sub-link:hover { color: var(--electric-blue); border-left-color: var(--electric-blue); transform: translateX(5px); }

    /* 3. PRODUCT SHOWCASE */
    .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }

    .image-vessel {
        background: #fff;
        border-radius: 24px;
        padding: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        aspect-ratio: 1/1;
        box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        position: relative;
        overflow: hidden;
        border: 1px solid var(--border-color);
    }

    .image-vessel img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .info-content .category-badge {
        font-family: var(--accent-font);
        background: rgba(214, 91, 97, 0.1);
        color: var(--electric-blue);
        padding: 6px 14px;
        border-radius: 50px;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        border: 1px solid rgba(214, 91, 97, 0.36);
    }

    .info-content h1 { font-size: 4rem; font-weight: 800; margin: 20px 0; line-height: 1.1; color: white; }

    .price-block { font-size: 4.5rem; font-weight: 800; color: #fff; margin-bottom: 30px; letter-spacing: -1px; }
    .price-block span { font-size: 2rem; color: var(--btn-red); vertical-align: top; margin-left: 5px; }

    .trust-badges {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 40px;
    }

    .trust-item {
        background: rgba(255,255,255,0.02);
        padding: 15px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.3rem;
        color: #8b949e;
    }

    .trust-item ion-icon { font-size: 2.4rem; color: var(--electric-blue); }

    /* 4. BUTTONS & QUANTITY */
    .action-stack { display: flex; flex-direction: column; gap: 20px; }
    
    .qty-selector {
        display: flex;
        align-items: center;
        gap: 20px;
        background: #000;
        width: fit-content;
        padding: 10px 20px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 20px;
    }
    
    .qty-selector input {
        background: none; border: none; color: white; width: 50px; text-align: center;
        font-size: 2rem; font-family: var(--accent-font); font-weight: bold;
    }

    .button-group { display: flex; gap: 15px; }

    .btn-main {
        flex: 1;
        padding: 20px;
        border-radius: 14px;
        font-weight: 800;
        text-transform: uppercase;
        font-size: 1.5rem;
        cursor: pointer;
        transition: 0.4s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    /* 5. STRUCTURED SPECS */
    .specs-section { margin-top: 80px; }
    .specs-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
    .specs-title::after { content: ''; flex-grow: 1; height: 1px; background: var(--border-color); }

    .specs-grid-v2 {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 20px;
    }

    .spec-item-v2 {
        background: rgba(255,255,255,0.02);
        padding: 20px;
        border-radius: 15px;
        border: 1px solid var(--border-color);
        display: flex;
        align-items: flex-start;
        gap: 15px;
        transition: 0.3s;
    }

    .spec-item-v2:hover { background: rgba(255,255,255,0.04); border-color: var(--electric-blue); }
    .spec-item-v2 ion-icon { font-size: 2.2rem; color: var(--electric-blue); }
    .spec-item-v2 span { font-weight: 500; font-size: 1.6rem; color: #d1d5db; }

    /* MOBILE BUG FIX: Preventing Squishing and allowing smooth scroll */
    @media (max-width: 1100px) {
        .detail-wrapper { grid-template-columns: 1fr; }
        .hero-grid { grid-template-columns: 1fr; gap: 40px; }
        .sidebar-card { 
            position: static; 
            width: 100%; 
            display: flex !important; 
            flex-direction: row !important; 
            overflow-x: auto !important; 
            white-space: nowrap !important; 
            gap: 10px; 
            padding: 15px !important; 
            scrollbar-width: none;
            flex-wrap: nowrap !important;
        }
        .sidebar-card::-webkit-scrollbar { display: none; }
        .sidebar-card h2 { display: none; }
        .nav-group { margin: 0; flex-shrink: 0; }
        .sidebar-card > .sub-link, .nav-header { 
            padding: 10px 20px !important; 
            border-radius: 50px !important; 
            background: rgba(255,255,255,0.05) !important; 
            border: 1px solid var(--border-color) !important;
            flex-shrink: 0 !important; /* PREVENTS BUGS */
            display: inline-flex !important;
            align-items: center;
        }
        .nav-submenu { display: none !important; }
        .specs-grid-v2 { grid-template-columns: 1fr; }
    }
  </style>

    <script src="./assets/js/store-config.js"></script>
    <script src="./assets/js/demo-products.js"></script>
    <script src="./assets/js/storefront.js"></script>
    <script src="./assets/js/script.js"></script>
    <script>
    let globalItem = null;

    // DYNAMIC PAGE LOADING
    async function initProductPage() {
        const id = new URLSearchParams(window.location.search).get('id');
        try {
            const data = await window.TkiStorefront.getProducts();
            const item = data.find(p => String(p.id) === String(id));

            if(!item) {
                document.getElementById('dynamicProductArea').innerHTML = "<h1 style='text-align:center;'>Product Not Found</h1>";
                return;
            }
            globalItem = item;

            const demoItem = window.TkiStorefront.isDemoProduct(item);
            const images = window.TkiStorefront.productImages(item, { includePromotional: false });
            const specs = (item.specs || '').split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            const specsHTML = specs.map(line => `<li>${window.TkiStorefront.escapeHtml(line)}</li>`).join('');
            const category = window.TkiStorefront.escapeHtml(window.TkiStorefront.categoryLabel(item.category));
            const isPrebuilt = String(item.category || '').toLowerCase() === 'prebuilt';
            const galleryTypeClass = isPrebuilt ? 'product-gallery--prebuilt' : 'product-gallery--component';
            const name = window.TkiStorefront.escapeHtml(item.name);
            const available = Number(item.stock) > 0;

            document.getElementById('dynamicProductArea').innerHTML = `
                <div class="product-detail-layout">
                    <section class="product-gallery ${galleryTypeClass}" aria-label="${name} product images">
                        <figure class="product-gallery__main photo-stage" tabindex="0" aria-label="Product photos. Swipe or use arrow keys to browse.">
                            <span class="photo-stage__placeholder"${images.length ? ' hidden' : ''}>Photo unavailable</span>
                            <img id="mainProductImage" ${images.length ? `src="${window.TkiStorefront.escapeHtml(images[0])}"` : ''} alt="${name}" fetchpriority="high" decoding="async">
                            ${images.length > 1 ? `<span class="product-gallery__index" aria-live="polite">1 / ${images.length}</span>` : ''}
                        </figure>
                        ${images.length > 1 ? `<div class="product-gallery__thumbs" aria-label="Choose product image">${images.map((image, index) => `
                            <button type="button" class="product-gallery__thumb${index === 0 ? ' is-active' : ''}" data-detail-image="${window.TkiStorefront.escapeHtml(image)}" aria-label="Show image ${index + 1}" aria-pressed="${index === 0}">
                                <img src="${window.TkiStorefront.escapeHtml(image)}" alt="" loading="lazy" decoding="async">
                            </button>`).join('')}</div>` : ''}
                    </section>
                    <section class="product-detail-info">
                        <span class="product-detail__category">${category}</span>
                        <h1>${name}</h1>
                        <p class="product-detail__price">${window.TkiStorefront.formatPrice(item.price)}</p>
                        <p class="product-detail__stock ${available ? 'is-available' : 'is-unavailable'}"><span aria-hidden="true"></span>${available ? 'Available' : 'Out of stock'}</p>
                        <p class="product-detail__summary">${window.TkiStorefront.escapeHtml(specs[0] || 'Explore the specifications below or ask our team for details.')}</p>
                        <div class="product-detail__order-row">
                            <label for="finalQty">Quantity</label>
                            <input type="number" id="finalQty" value="1" min="1"${available ? ` max="${Number(item.stock)}"` : ''} inputmode="numeric">
                        </div>
                        ${demoItem
                            ? '<p class="product-detail__order product-detail__order--preview" aria-disabled="true">Preview only - ordering disabled</p>'
                            : `<a class="product-detail__order" id="desktopOrderLink" href="#" target="_blank" rel="noopener noreferrer">
                                <ion-icon name="logo-whatsapp" aria-hidden="true"></ion-icon><span>${available ? 'Order via WhatsApp' : 'Ask about availability'}</span>
                            </a>`}
                        ${demoItem ? '' : '<p class="product-detail__order-note">Your message opens directly in WhatsApp with this product and price.</p>'}
                    </section>
                </div>

                <section class="product-specifications" aria-labelledby="specificationsTitle">
                    <p class="eyebrow">PRODUCT DETAILS</p>
                    <h2 id="specificationsTitle">Specifications</h2>
                    <ul>${specsHTML || '<li>Contact us for product specifications.</li>'}</ul>
                </section>
            `;

            if (demoItem) {
                document.querySelector('.product-detail__order-row').style.display = 'none';
                document.getElementById('mobileOrderBar').style.display = 'none';
            } else {
                const quantityInput = document.getElementById('finalQty');
                const desktopOrderLink = document.getElementById('desktopOrderLink');
                const mobileOrderLink = document.getElementById('mobileOrderLink');
                document.getElementById('mobileOrderPrice').textContent = window.TkiStorefront.formatPrice(item.price);
                const refreshOrderLinks = () => {
                    let quantity = Math.max(1, Number.parseInt(quantityInput.value, 10) || 1);
                    if (available) quantity = Math.min(quantity, Number(item.stock));
                    quantityInput.value = quantity;
                    const message = window.createProductOrderMessage(item, quantity);
                    const orderUrl = window.createWhatsAppOrderUrl(message);
                    desktopOrderLink.href = orderUrl;
                    if (mobileOrderLink) mobileOrderLink.href = orderUrl;
                };
                quantityInput.addEventListener('input', refreshOrderLinks);
                refreshOrderLinks();
            }
            const galleryImage = document.getElementById('mainProductImage');
            window.TkiStorefront.bindProductImages(document.querySelector('.product-gallery'));
            const thumbnails = [...document.querySelectorAll('[data-detail-image]')];
            let activeImageIndex = 0;
            const selectImage = index => {
                if (!images.length) return;
                activeImageIndex = (index + images.length) % images.length;
                window.TkiStorefront.setProductImage(galleryImage, images[activeImageIndex]);
                const counter = document.querySelector('.product-gallery__index');
                if (counter) counter.textContent = `${activeImageIndex + 1} / ${images.length}`;
                thumbnails.forEach((thumbnail, thumbnailIndex) => {
                    const active = thumbnailIndex === activeImageIndex;
                    thumbnail.classList.toggle('is-active', active);
                    thumbnail.setAttribute('aria-pressed', String(active));
                });
                const selected = thumbnails[activeImageIndex];
                if (selected) selected.parentElement.scrollTo({ left: selected.offsetLeft - selected.parentElement.offsetLeft - (selected.parentElement.clientWidth - selected.clientWidth) / 2, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
            };
            thumbnails.forEach((button, index) => button.addEventListener('click', () => selectImage(index)));
            window.TkiStorefront.bindTouchSwipe(document.querySelector('.product-gallery__main'), direction => {
                if (images.length > 1) selectImage(activeImageIndex + direction);
            });
            document.querySelector('.product-gallery__main').addEventListener('keydown', event => {
                if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
                event.preventDefault();
                selectImage(activeImageIndex + (event.key === 'ArrowRight' ? 1 : -1));
            });
        } catch (e) { console.error(e); }
    }

    async function init() {
        await initProductPage();
    }

    // Trigger the sequence
    init();
  </script>
